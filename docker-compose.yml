services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doacoes
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d doacoes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
