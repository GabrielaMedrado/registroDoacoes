name: CI

on:
  push:
    # Tags são verificadas pela release (release.yml chama este workflow).
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      versao:
        description: Versão do build (sem o v), usada pela release
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Testes, Checkstyle e cobertura
        env:
          VERSAO: ${{ inputs.versao }}
        run: ./mvnw -B verify ${VERSAO:+-Drevision=$VERSAO}

      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

      - name: Especificação OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/openapi.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x scripts/*.sh scripts/testes/*.sh

      - name: Testes dos scripts
        run: bash scripts/testes/todos.sh
