name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - id: versao
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $GITHUB_REF_NAME. Use o formato vX.Y.Z." >&2
            exit 2
          fi
          echo "versao=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  verificar:
    needs: preparar
    uses: ./.github/workflows/ci.yml
    with:
      versao: ${{ needs.preparar.outputs.versao }}

  imagem:
    needs: [preparar, verificar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSAO=${{ needs.preparar.outputs.versao }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Só publica uma imagem que sobe de verdade com o banco (projeto separado: o down -v só apaga o dele).
      - name: Teste de fumaça
        env:
          APP_VERSAO: ${{ github.ref_name }}
          DB_USER: doacoes
          DB_PASSWORD: fumaca-${{ github.run_id }}
        run: |
          docker compose -p fumaca up -d --no-build
          bash scripts/verificar-implantacao.sh || { docker compose -p fumaca logs app; exit 1; }
          docker compose -p fumaca down -v

      - name: Publicação no GHCR
        run: docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"

  pages:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: openapi

      - name: Javadoc
        working-directory: backend
        run: ./mvnw -B -q javadoc:javadoc -Ddoclint=none -Dcheckstyle.skip

      - name: Montagem do site
        run: |
          mkdir -p site
          cp -r docs/pages/. site/
          cp openapi/openapi.json site/api/openapi.json
          cp -r backend/target/reports/apidocs site/javadoc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4

  publicar:
    needs: imagem
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub Release com o changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/changelog.sh "$GITHUB_REF_NAME" > notas.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notas.md
