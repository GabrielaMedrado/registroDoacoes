name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - id: versao
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $GITHUB_REF_NAME. Use o formato vX.Y.Z." >&2
            exit 2
          fi
          echo "versao=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  verificar:
    needs: preparar
    uses: ./.github/workflows/ci.yml
    with:
      versao: ${{ needs.preparar.outputs.versao }}

  imagem:
    needs: [preparar, verificar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSAO=${{ needs.preparar.outputs.versao }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Só publica uma imagem que sobe de verdade com o banco (projeto separado: o down -v só apaga o dele).
      - name: Teste de fumaça
        env:
          APP_VERSAO: ${{ github.ref_name }}
          DB_USER: doacoes
          DB_PASSWORD: fumaca-${{ github.run_id }}
        run: |
          docker compose -p fumaca up -d --no-build
          bash scripts/verificar-implantacao.sh || { docker compose -p fumaca logs app; exit 1; }
          docker compose -p fumaca down -v

      - name: Publicação no GHCR
        run: docker push --all-tags "ghcr.io/${GITHUB_REPOSITORY,,}"

  # O repositório é privado e o GitHub Pages não é publicado: a especificação OpenAPI e o Javadoc
  # vão como anexos da Release (visíveis para quem tem acesso ao repositório).
  documentacao:
    needs: [preparar, verificar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Javadoc
        working-directory: backend
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
        run: ./mvnw -B -q javadoc:javadoc -Ddoclint=none -Dcheckstyle.skip -Drevision="$VERSAO"

      - name: Compactação do Javadoc
        run: cd backend/target/reports/apidocs && zip -q -r "$GITHUB_WORKSPACE/javadoc-$GITHUB_REF_NAME.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: javadoc-${{ github.ref_name }}.zip

  publicar:
    needs: [imagem, documentacao]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: openapi

      - uses: actions/download-artifact@v4
        with:
          name: javadoc

      - name: GitHub Release com o changelog e a documentação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/changelog.sh "$GITHUB_REF_NAME" > notas.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notas.md openapi.json "javadoc-$GITHUB_REF_NAME.zip"
