name: Implantar no servidor
description: Leva o Compose e os scripts ao servidor por SSH, faz o backup (se pedido) e troca a versão da aplicação.

inputs:
  host:
    description: Endereço do servidor
    required: true
  usuario:
    description: Usuário SSH
    required: true
  chave:
    description: Chave privada SSH
    required: true
  known-hosts:
    description: Linhas do known_hosts do servidor (ssh-keyscan)
    required: true
  versao:
    description: Tag publicada pela release (vX.Y.Z)
    required: true
  backup:
    description: "'true' para subir o banco e rodar scripts/backup.sh antes de trocar a versão"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Implantação
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USUARIO: ${{ inputs.usuario }}
        CHAVE: ${{ inputs.chave }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        VERSAO: ${{ inputs.versao }}
        BACKUP: ${{ inputs.backup }}
      run: |
        set -euo pipefail
        if [[ ! "$VERSAO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Versão inválida: $VERSAO. Use o formato vX.Y.Z." >&2
          exit 2
        fi

        install -m 700 -d ~/.ssh
        printf '%s\n' "$CHAVE" > ~/.ssh/deploy
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts

        # Host desconhecido derruba a conexão: a chave nunca vai para um servidor que não seja o nosso.
        opcoes=(-i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes)
        destino="$USUARIO@$HOST"

        ssh "${opcoes[@]}" "$destino" 'mkdir -p ~/registro-doacoes/scripts'
        scp "${opcoes[@]}" docker-compose.yml "$destino:registro-doacoes/"
        scp "${opcoes[@]}" scripts/backup.sh scripts/implantar.sh scripts/verificar-implantacao.sh \
          "$destino:registro-doacoes/scripts/"
        ssh "${opcoes[@]}" "$destino" 'chmod +x ~/registro-doacoes/scripts/*.sh'

        # --backup: o implantar.sh sobe o banco, faz o backup e só troca a versão se ele der certo.
        opcao=""
        if [[ "$BACKUP" == true ]]; then
          opcao="--backup"
        fi
        # A versão já foi validada acima; ela precisa mesmo ser expandida aqui, no runner.
        # shellcheck disable=SC2029
        ssh "${opcoes[@]}" "$destino" "cd ~/registro-doacoes && ./scripts/implantar.sh $VERSAO $opcao"
