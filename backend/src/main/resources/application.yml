spring:
  application:
    name: doacoes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doacoes}
    username: ${DB_USER:doacoes}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  admin-inicial:
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}

springdoc:
  swagger-ui:
    enabled: false
